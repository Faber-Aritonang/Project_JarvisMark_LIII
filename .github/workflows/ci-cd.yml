name: CI/CD Pipeline for Dodol (Mark-LIII Fork)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install py_compile astroid pylint
      
      - name: Python syntax check
        run: |
          find . -name "*.py" -not -path "./.git/*" -exec python -m py_compile {} \;
      
      - name: Lint with pylint (basic)
        run: |
          pylint --disable=all --enable=E,F main.py ui.py setup.py --max-line-length=120 || true
      
      - name: Check for import errors
        run: |
          python -c "import ast; [ast.parse(open(f).read(), filename=f) for f in [\"main.py\", \"ui.py\", \"setup.py\"]]" || true

  test-on-multiple-os:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.11"
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies (Python only)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      
      - name: Verify project structure
        run: |
          test -f main.py
          test -f ui.py
          test -f setup.py
          test -d actions/
          test -d core/
          test -d config/
          test -d memory/
          test -d plugins/
          test -d dashboard/
      
      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          python -m py_compile ui.py
          python -m py_compile setup.py
          for f in actions/*.py core/*.py memory/*.py plugins/*.py dashboard/*.py; do
            python -m py_compile "$f" 2>/dev/null || echo "Syntax check for $f skipped"
          done

  build-package:
    runs-on: ubuntu-latest
    needs: lint-and-test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel
      
      - name: Build distribution
        run: |
          python -m build --sdist --wheel || true
      
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dodol-build
          path: dist/*

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run security audit
        uses: python/security-audit@v1.0
        with:
          path: .
          command: audit
      
      - name: Check for pip vulnerabilities
        run: |
          pip install pip-audit || true
          pip-audit -r requirements.txt || true

  deploy-to-pypi:
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-package]
    if: github.repository == 'Faber-Aritonang/Project_JarvisMark_LIII'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
      
      - name: Build package
        run: python -m build --sdist --wheel
      
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          twine upload dist/* || echo "PyPI deployment skipped - no token configured"

  deploy-to-github-releases:
    runs-on: ubuntu-latest
    needs: build-package
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build
      
      - name: Build package
        run: python -m build --sdist --wheel
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl
          generate_release_notes: true